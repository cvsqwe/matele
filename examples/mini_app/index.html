<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Магазин</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f5f5f7; color: #111; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    .item { display: flex; justify-content: space-between; align-items: center; background: #fff;
            border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .item.highlight { outline: 2px solid #2f7cf6; }
    button { border: 0; border-radius: 8px; padding: 8px 14px; background: #2f7cf6; color: #fff; font-size: 15px; }
    #status { margin-top: 16px; color: #555; }
  </style>
</head>
<body>
  <h1>Что заказать?</h1>
  <div class="item" id="coffee"><span>Кофе</span><button data-item="Кофе">Заказать</button></div>
  <div class="item" id="tea"><span>Чай</span><button data-item="Чай">Заказать</button></div>
  <div class="item" id="cake"><span>Пирожное</span><button data-item="Пирожное">Заказать</button></div>
  <p id="status"></p>

  <script>
    // The same page works in both messengers: each one has its own bridge.
    const tg = window.Telegram && window.Telegram.WebApp;
    const inTelegram = Boolean(tg && tg.initData);
    const platform = inTelegram ? "telegram" : "max";
    const initData = inTelegram ? tg.initData : (window.WebApp && window.WebApp.initData) || "";

    // The button's app="..." value: Telegram gets it in the URL, MAX in initData.
    const startParam = inTelegram
      ? new URLSearchParams(location.search).get("startapp")
      : window.WebApp && window.WebApp.initDataUnsafe && window.WebApp.initDataUnsafe.start_param;
    if (startParam) document.getElementById(startParam)?.classList.add("highlight");
    if (inTelegram) tg.ready();

    for (const button of document.querySelectorAll("button[data-item]")) {
      button.addEventListener("click", async () => {
        const status = document.getElementById("status");
        status.textContent = "Отправляем…";
        const response = await fetch("/api/order", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Platform": platform, "X-Init-Data": initData },
          body: JSON.stringify({ item: button.dataset.item }),
        });
        status.textContent = response.ok ? "Готово, подтверждение пришло в чат" : "Не получилось: " + response.status;
      });
    }
  </script>
</body>
</html>
