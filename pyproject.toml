[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "matele"
dynamic = ["version"]
description = "One bot, two messengers: an async framework for MAX and Telegram bots"
authors = [{ name = "cvsqwe" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
	"certifi>=2024.2.2",
	"httpx>=0.27",
]
keywords = ["bot", "max", "telegram", "framework", "asyncio"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Framework :: AsyncIO",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Natural Language :: Russian",
	"Topic :: Communications :: Chat",
	"Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/cvsqwe/matele"
Documentation = "https://cvsqwe.github.io/matele/"
Source = "https://github.com/cvsqwe/matele"
Issues = "https://github.com/cvsqwe/matele/issues"
Changelog = "https://github.com/cvsqwe/matele/blob/main/CHANGELOG.md"

[project.optional-dependencies]
webhook = ["uvicorn>=0.29"]
redis = ["redis>=5"]
docs = ["mkdocs-material>=9.6,<10"]
dev = [
	"ruff>=0.17.4",
	"pytest>=8",
	"pytest-asyncio>=0.23",
	"pytest-cov>=5",
	"basedpyright==1.40.2",
	"uvicorn>=0.29",
	"redis>=5",
	"fastapi>=0.110",  # examples/mini_app
]

[tool.hatch.version]
path = "src/matele/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/matele"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests", "examples", "tools"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E101"]
